server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed assets are immutable; the entry point must never be cached or a
    # stale shell will keep requesting bundles that no longer exist.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # The image builds the SPA with VITE_API_BASE="" (same origin). Without
    # these two blocks every REST call and the monitor websocket would fall
    # through to the SPA fallback and return index.html instead of data.
    # "api" is the compose service name; depends_on makes it resolvable before
    # nginx starts.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # Mining runs are long and mostly idle; the default 60s read timeout
        # would drop a healthy monitor connection between progress events.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Client-side routes (/backtest, /inspector, ...) have no files on disk.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
