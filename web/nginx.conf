server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed assets are immutable; the entry point must never be cached or a
    # stale shell will keep requesting bundles that no longer exist.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Client-side routes (/backtest, /inspector, ...) have no files on disk.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
